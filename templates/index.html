<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snaggr — TikTok Video Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="grain"></div>

  <header class="topbar">
    <div class="logo">
      <span class="logo-mark"></span>
      <span class="logo-text">snaggr</span>
    </div>
    <div class="topbar-right">
      <span class="tag">no watermark · 720p / 1080p / mp3</span>
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
        <span id="themeIcon">☾</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="hero">
      <p class="eyebrow">paste a link, pull the clip</p>
      <h1>Drop the TikTok URL.<br><span class="grad">Pick a quality.</span> Done.</h1>

      <div class="mode-row">
        <button type="button" id="modeToggle" class="mode-toggle" aria-pressed="false">
          <span class="switch"><span class="switch-dot"></span></span>
          <span id="modeLabel">Single link</span>
        </button>
        <button type="button" id="pasteBtn" class="paste-btn">Paste</button>
      </div>

      <form id="linkForm" class="link-form" autocomplete="off">
        <textarea
          id="urlInput"
          rows="1"
          placeholder="https://www.tiktok.com/@user/video/..."
          required
        ></textarea>
        <button type="submit" id="fetchBtn">
          <span class="btn-label" id="fetchBtnLabel">Fetch</span>
        </button>
      </form>
      <p class="batch-hint" id="batchHint" hidden>Batch mode: one link per line.</p>

      <div id="statusLine" class="status-line" role="status" aria-live="polite"></div>
      <div class="scanbar" id="scanbar" hidden><div class="scanbar-fill"></div></div>
    </section>

    <section class="results" id="results"></section>

    <section class="history" id="historySection" hidden>
      <div class="history-head">
        <h3>Recent downloads</h3>
        <button type="button" id="clearHistory" class="clear-history">Clear</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </section>
  </main>

  <footer class="credit">
    <span>built by</span>
    <a href="https://instagram.com/oua1l.1" target="_blank" rel="noopener noreferrer">
      <span class="ig-mark">◎</span> @Oua1l.1
    </a>
  </footer>

  <template id="cardTemplate">
    <article class="preview">
      <div class="preview-media">
        <img alt="" class="thumb" />
        <span class="duration"></span>
      </div>
      <div class="preview-body">
        <p class="preview-author"></p>
        <h2 class="preview-title"></h2>

        <div class="quality-row">
          <button class="quality-btn" data-quality="720">
            <span class="q-num">720</span><span class="q-p">p</span>
            <span class="q-sub">standard</span>
          </button>
          <button class="quality-btn" data-quality="1080">
            <span class="q-num">1080</span><span class="q-p">p</span>
            <span class="q-sub">high definition</span>
          </button>
          <button class="quality-btn" data-quality="mp3">
            <span class="q-num">mp3</span>
            <span class="q-sub">audio only</span>
          </button>
        </div>
<script src="https://pl30853087.effectivecpmnetwork.com/60/f0/cd/60f0cdc5b8759aaf3a1e2b1f6a6fd650.js"></script>
        
        <div class="progress-track" hidden>
          <div class="progress-fill"></div>
        </div>
        <div class="download-status" aria-live="polite"></div>
      </div>
    </article>
  </template>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
<script async="async" data-cfasync="false" src="https://pl30853086.effectivecpmnetwork.com/715ea71e482b2b648f2d62adc7ef9ad5/invoke.js"></script>
<div id="container-715ea71e482b2b648f2d62adc7ef9ad5"></div>
  
</body>
</html>
